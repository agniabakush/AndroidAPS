name: Boost KMP port integration

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/boost-port-ci.yml'
      - 'plugins/boost-port/**'
      - 'app/build.gradle.kts'
      - 'settings.gradle'

permissions:
  contents: read

jobs:
  boost-port:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Read JDK version
        id: jdk
        run: echo "version=$(jq -r '.default' .github/jdk-map.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
          cache: gradle
      - name: Constrain build memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Xss4m
          org.gradle.workers.max=2
          kotlin.daemon.jvm.options=-Xmx4g
          EOF
      - name: Run migrated Boost common/JVM tests
        run: |
          chmod +x gradlew
          ./gradlew :plugins:boost-port:jvmTest --no-daemon --stacktrace
      - name: Compile complete Android fullDebug APK
        run: |
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace
      - name: Publish Boost KMP test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-port-test-reports
          path: |
            plugins/boost-port/build/reports/tests/
            plugins/boost-port/build/test-results/
          if-no-files-found: ignore
